[package]
name = "cognee-desktop"
version = "0.1.1"
description = "Cognee local memory desktop client"
authors = ["Cognee"]
edition = "2024"

[lib]
name = "cognee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "time", "fs", "io-util", "sync", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
